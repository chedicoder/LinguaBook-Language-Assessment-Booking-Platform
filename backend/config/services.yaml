services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $frontendOrigin: '%env(FRONTEND_ORIGIN)%'
            bool $cookieSecure: '%env(bool:COOKIE_SECURE)%'
            int $jwtTtl: '%env(int:JWT_TTL)%'
            string $mongoDatabase: '%env(MONGODB_DB)%'
            Symfony\Component\RateLimiter\RateLimiterFactory $authLimiter: '@limiter.auth'

    App\:
        resource: '../src/'
        exclude:
            - '../src/Document/'
            - '../src/DTO/'

    MongoDB\Client:
        arguments:
            - '%env(resolve:MONGODB_URI)%'
