security:
    password_hashers:
        App\Document\User:
            algorithm: auto
    providers:
        app_users:
            id: App\Security\UserProvider
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        api:
            pattern: ^/api
            stateless: true
            provider: app_users
            jwt: ~
    access_control:
        - { path: ^/api/auth/(register|login|csrf)$, roles: PUBLIC_ACCESS }
        - { path: ^/api/sessions$, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/sessions/[^/]+$, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
